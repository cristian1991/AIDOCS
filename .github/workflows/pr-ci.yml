name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  public-pr-ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install MCP package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ./mcp

      - name: Compile Python sources
        shell: bash
        run: |
          python -m compileall mcp/server/aidocs_mcp

      - name: CLI smoke setup
        shell: bash
        run: |
          mkdir -p .pr-ci/sample/src
          cat > .pr-ci/sample/src/app.py <<'EOF'
          def hello():
              return "hello"
          EOF
          aidocs init ./.pr-ci/sample --json > ./.pr-ci/init.json
          aidocs status ./.pr-ci/sample --json > ./.pr-ci/status.json
          aidocs sync ./.pr-ci/sample --json > ./.pr-ci/sync.json
          aidocs benchmark ./.pr-ci/sample --json --iterations 2 --scenario-set public --out ./.pr-ci/benchmark.json > ./.pr-ci/benchmark.stdout.json
          aidocs version --json > ./.pr-ci/version.json

      - name: Write public validation summary
        shell: bash
        run: |
          cat > ./.pr-ci/summary.json <<'EOF'
          {
            "status": "passed",
            "scope": "public-unprivileged",
            "notes": [
              "No secrets used.",
              "No private tests executed.",
              "CLI smoke and public benchmark scenario set completed."
            ]
          }
          EOF

      - name: Upload public CI summary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-ci-summary
          path: ./.pr-ci/summary.json
