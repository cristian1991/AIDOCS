[interaction.lifecycle]
task_complete = "Lifecycle follow-through: meaningful edit work happened since the last lifecycle tool call; use `aidocs_task_complete` if the task is done."
task_update = "Lifecycle follow-through: meaningful work has accumulated since the last lifecycle tool call; use `aidocs_task_update` to record progress."

[interaction.entry]
execution_prompt = "Execute the `/aidocs` entry flow now for the current project. Use the `aidocs` MCP server first when available. Call the MCP orchestrator entry flow for this project. If setup is required, initialize AIDOCS first and then continue bootstrap. If multiple plausible sessions exist, STOP and ask the user which session to bind. Keep the default user-facing output terse and prefer the top-level `report` field when present. Report: setup required or not, index sync status, selected session or session-selection requirement, managed-mode state and bound session, and the first retrieval bundle only when useful. Do not broad-read the repo before AIDOCS bootstrap and session selection complete unless the user explicitly points at a file or error first."

[interaction.errors]
indexed_read_gate = "Indexed-query prerequisite not satisfied. Use indexed retrieval tools first (for example: code_investigate, code_find, code_trace, code_bundle, schema_query, code_get_service_api)."
protected_config_edit = "BLOCKED: {file_name} is a protected AIDOCS config file. Edit it manually."
infrastructure_edit_blocked = "BLOCKED: Cannot edit AIDOCS infrastructure ({label}). Set dev_mode=true in aidocs.toml to enable."
shell_protected_target = "BLOCKED: Shell command targets protected AIDOCS infrastructure ({label})."

[interaction.runtime]
no_session_plan = "No session plan is available. Summarize the remaining roadmap and session-local open work, then ask the user what to work on next."
plan_progress = "Plan is {progress} complete. Next step: {next_step}. {suffix}"
plan_complete = "Plan is fully complete. All steps are checked off."
no_plan_or_roadmap = "No session plan, roadmap, or session-local open work is available. Ask the user for next steps or create a plan or roadmap first."
task_complete_next_steps = "- Work completed; choose the next roadmap/plan slice or close the session."

[interaction.action_directives]
edit = "`task_begin` → `aidocs_code_get_lines` (read) → `aidocs_code_edit_lines` or `aidocs_code_batch_edit` (write) → `task_complete`. Do NOT mix edit methods. Before editing: `aidocs_code_get_method_signature` / `aidocs_code_get_constructor_params` to confirm signatures. CSS: `aidocs_code_trace(class, mode=\"css_class\")`. DB: `aidocs_schema_query(entity, mode=\"entity\")`."
trace = "`aidocs_code_find(query, mode=\"references\")` → `aidocs_code_trace(query, mode=\"field_flow\"|\"css_class\"|\"api_to_ui\")`. DB: `aidocs_schema_query(\"Source→Target\", mode=\"trace_path\")`."
understand = "`aidocs_session_resume_bundle` (project/session/skills/plan overview) → `aidocs_action_surface_current_session_bundle` (likely next tools) → `aidocs_code_find(query, mode=\"symbols\")` → `aidocs_code_get_symbol_snippet`. Precision: `aidocs_code_get_method_signature`, `aidocs_code_get_constructor_params`, `aidocs_code_get_enum_values`, `aidocs_code_get_service_api`. Broad: `aidocs_code_bundle(concept, mode=\"subsystem\")`. DB: `aidocs_schema_query(name, mode=\"entity\")`."
read_error = "`aidocs_code_find(symbol, mode=\"symbols\")` → `aidocs_code_find(symbol, mode=\"references\")` → `aidocs_code_get_symbol_snippet`. DB: `aidocs_schema_query(entity, mode=\"entity\")`."
investigate = "`session_resume_bundle` (overview) → `action_surface_current_session_bundle` (common path) → `code_investigate(concept)` for guided navigation. Or: `code_bundle(concept, mode=\"subsystem\")` → `code_find(concept, mode=\"mutations\"|\"validation\"|\"policy\")`."
inspect = "`session_resume_bundle` (overview) → `action_surface_current_session_bundle` (common path) → `code_get_dependencies` / `code_find_dependents` → `code_get_modules`. Read only after narrowing."
