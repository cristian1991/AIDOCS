reason = """
VEX: NOT AFFECTED (vulnerable code not in execute path). CVE-2026-45829 /
GHSA-f4j7-r4q5-qw2c is a pre-authentication code-injection (CWE-94, CVSS:4.0
AV:N) in ChromaDB's HTTP SERVER — it requires an attacker to reach the
network endpoint /api/v2/tenants/{tenant}/databases/{db}/collections with a
malicious model repository + trust_remote_code=true. AIDOCS/mempalace use
chromadb EMBEDDED ONLY (PersistentClient/EphemeralClient over a local SQLite
file): there is NO chromadb HTTP server, no /api/v2 endpoint, no network
listener, and no attacker-supplied model-repo path anywhere in the tree
