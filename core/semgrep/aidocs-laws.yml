# AIDOCS doctrine laws — Semgrep rules
#
# Doctrine 2026-05-29 (king re-seal — deploy-gate truth, post-bloat):
# Gate 1c invokes this ruleset with `--error`. EVERY new finding
# fails the deploy. After the 2026-05-29 semgrep audit pass:
#   - cli.py editor launch: MIGRATED to subprocess.run argv (waiver gone)
#   - mcp_server.py related-project wrapper: MIGRATED to compile() +
#     types.FunctionType (waiver gone)
#   - shell_egress_service.py execute_shell(): KEPT — the ONE
#     chokepoint where shell-string semantics survive after the
#     destructive_floor + heuristic_judge cascade. Rationale rewritten
#     to NOT claim the destructive_floor "closes" all injection;
#     caller contract enforced by
#     test_no_untrusted_fragment_concat_into_execute_shell.
# baseline_count=1 (was 3 pre-audit).
# To add a NEW waiver, annotate the specific line with
# `# nosemgrep:<rule-id>  # <why>` and reference the rationale in
# the commit. The baseline is intentional friction, not silent
# suppression — `grep -rn nosemgrep mcp/server` lists every audit.
#
# Severity: ERROR across every rule. Deliberately consistent with the
# deploy-script call (`--error`) and the README in mcp/.deploy-
# reports/. One doctrine, three surfaces, same answer.
#
# Why rules here and not in tests: tests prove behavior on inputs you
# thought to write; semgrep proves SHAPE — code patterns that would
# violate doctrine independent of which input flows through them. The
# combination is what the king's "structural law + behavioral law"
# doctrine pins.

rules:
  - id: aidocs-direct-subprocess-outside-shell-egress
    # King re-seal 2026-05-29: every shell-execution path in
    # mcp/server/aidocs_mcp/ must route through
    # shell_egress_service.ShellEgressService once the migration
    # completes. Current state: 27 legacy call sites are tracked
    # in shell_egress_service.LEGACY_SUBPROCESS_CALLSITES and
    # enforced by a doctrine test that refuses NEW direct
    # subprocess additions not in that allowlist. The rule
    # surfaces every finding for visibility but stays at WARNING
    # severity so Gate 1c doesn't block on the 27-file legacy
    # baseline. New additions are caught by the inventory test
    # (test_subprocess_callsite_inventory_matches_repo) — that's
    # the actual enforcement surface today.
    # Promotion path: as files migrate to ShellEgressService and
    # the inventory shrinks to zero, flip this severity back to
    # ERROR and the rule becomes the second seal.
    pattern-either:
      - pattern: subprocess.run(...)
      - pattern: subprocess.Popen(...)
      - pattern: subprocess.call(...)
      - pattern: subprocess.check_output(...)
      - pattern: subprocess.check_call(...)
      - pattern: os.system(...)
    message: |
      Direct subprocess / os.system call outside the approved
      shell-egress chokepoint. Route through
      aidocs_mcp.shell_egress_service.ShellEgressService.execute()
      so bash_policy + heuristic_judge + destructive-floor + audit
      + output-guard semantics apply uniformly. To grandfather a
      legacy call site, add a row to LEGACY_SUBPROCESS_CALLSITES in
      shell_egress_service.py AND attach a `# nosemgrep:` waiver
      with a rationale.
    severity: WARNING
    languages: [python]
    paths:
      include:
        - "*.py"
      exclude:
        - "tests/**"
        - "scripts/**"
        - "**/shell_egress_service.py"
        # Doctrine 2026-05-29 (king re-seal — TWO-LAYER baseline):
        # The file-level excludes below silence semgrep --error so
        # Gate 1c stays green during the migration. They are NOT
        # the seal — they're noise control. The actual enforcement
        # that catches NEW subprocess calls inside a legacy file
        # is the per-file CALL-COUNT fingerprint in shell_egress_
        # service.LEGACY_SUBPROCESS_FINGERPRINTS, checked by
        # test_legacy_subprocess_call_counts_do_not_grow. Doctrine
        # tests fail BEFORE the deploy gate runs semgrep, so an
        # increase trips at PR-doctrine + at this commit's CI lane
        # even though semgrep --error never sees it. As each
        # legacy file migrates onto ShellEgressService, its row
        # comes off BOTH lists in the same commit; the
        # fingerprint test makes the unbalanced removal
        # impossible. When both lists are empty, severity flips
        # back to ERROR with no excludes and the rule becomes the
        # second seal.
        - "**/agent_expert_service.py"
        - "**/aidocs_nlp/installer.py"
        - "**/checkpoint_service.py"
        - "**/cli.py"
        - "**/code_runner.py"
        - "**/code_runner_detached.py"
        - "**/conditional_predicates.py"
        - "**/conductor_verification_service.py"
        - "**/csharp_roslyn_client.py"
        - "**/failure_stewardship.py"
        - "**/file_ops.py"
        - "**/git_helpers.py"
        - "**/governed_bash_service.py"
        - "**/governed_shell_attest.py"
        - "**/lane_resume_dispatcher.py"
        - "**/mcp_server.py"
        - "**/outer_gate_projects.py"
        - "**/package_integrity.py"
        - "**/runtime_bootstrap_service.py"
        - "**/runtime_provisioner.py"
        - "**/runtime_service.py"
        - "**/server_legacy_git_tools.py"
        - "**/server_plan_task_tools.py"
        - "**/shell_resolver.py"
        - "**/slop_backends.py"
        - "**/updater_service.py"
        - "**/workflow_action_service.py"

  - id: aidocs-no-os-system
    pattern: os.system(...)
    message: |
      Use code_runner / ai_run instead of os.system — every shell
      invocation must flow through the judge / bash_policy / T0
      gates. os.system bypasses all of that.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "*.py"
      exclude:
        - "tests/**"
        - "scripts/**"

  - id: aidocs-no-shell-true-in-subprocess
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
    message: |
      shell=True invites command injection. Pass argv as a list and
      let subprocess execve directly. If you genuinely need shell
      composition, route through code_runner.ai_run which applies
      bash_policy + judge.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "*.py"
      exclude:
        - "tests/**"
        - "scripts/**"

  - id: aidocs-no-bare-except-pass
    pattern: |
      try:
          ...
      except:
          pass
    message: |
      Bare-except + pass swallows EVERY exception including
      KeyboardInterrupt and SystemExit. Catch the specific class
      you expect; if the doctrine genuinely is "best-effort, never
      raise", catch Exception and log at debug — but never bare.
    severity: ERROR
    languages: [python]

  - id: aidocs-no-eval
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    message: |
      eval/exec on agent-derived strings is a code-injection vector.
      If you need dynamic dispatch, use a registry / lookup table.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "*.py"
      exclude:
        - "tests/**"

  - id: aidocs-no-pickle-load
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    message: |
      pickle is a deserialization-RCE surface. Use json / msgpack /
      protobuf for cross-process payloads. AIDOCS persists state via
      sqlite + json, not pickle, by doctrine.
    severity: ERROR
    languages: [python]

  - id: aidocs-no-hardcoded-vps-ip
    # The VPS IP is a deploy-script constant; it must NOT appear in
    # any runtime aidocs_mcp source. Catches a copy-paste from the
    # deploy script into a normal Python file.
    pattern-regex: '159\.195\.32\.176'
    message: |
      VPS IP hardcoded in source. Deploy infrastructure addresses
      belong in the deploy script (mcp/scripts/deploy_aidocs_gate.sh)
      or operator config — never in runtime code that would ship.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "*.py"
      exclude:
        - "scripts/**"
        - "tests/**"
