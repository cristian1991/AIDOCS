# osv-scanner VEX exceptions for the AIDOCS deploy gate (Gate 1e).
#
# Doctrine: an entry here is a DOCUMENTED, AUDITABLE risk-acceptance — NOT a
# silent waiver. Add an entry ONLY for a vulnerability proven not-exploitable in
# THIS deployment (VEX "not affected"), with the evidence written in `reason`.
#
# THE PREMISE IS THE EXPIRY, NOT A DATE (operator ruling 2026-08-31: "it's
# deliberate and forever, as long as it's safe, it's safe").
#
# These entries carried `ignoreUntil` review dates, and on 2026-08-31 all four
# lapsed at once and blocked a deploy — while the reasoning behind them was
# still, on re-verification, exactly as true as the day it was written. That is
# what a calendar measures: elapsed time, not risk. It fires when nothing has
# changed, and stays silent when something has.
#
# So an acceptance here does not expire on a date. It expires THE MOMENT ITS
# PREMISE STOPS HOLDING, and that is enforced mechanically by
# tests/security/test_chromadb_stays_embedded_only.py, which scans for the exact
# indicators each `reason` names and fails — naming the voided entries — if any
# appears. Each entry already said "a single hit VOIDS this waiver; it must then
# be removed, not re-dated"; the test is that sentence made executable.
#
# `ignoreUntil` remains available and is still right for a genuinely TEMPORARY
# acceptance — one waiting on an upstream release, say. It is wrong for a
# structural "not affected", where the honest trigger is the structure changing.

[[IgnoredVulns]]
