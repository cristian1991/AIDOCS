[package]
name = "aidocs-dashboard"
version = "2.1.0-beta.1"
description = "Secure local AIDOCS operator dashboard"
authors = ["CodeNexus"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
toml = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
