name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/aidocs-dashboard/src-tauri/target
          key: rust-release-${{ runner.os }}-${{ hashFiles('apps/aidocs-dashboard/src-tauri/Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-
      - name: Install frontend deps
        run: cd apps/aidocs-dashboard && npm ci

      - name: Build Tauri
        run: cd apps/aidocs-dashboard && npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-windows
          path: |
            apps/aidocs-dashboard/src-tauri/target/release/bundle/nsis/*.exe
            apps/aidocs-dashboard/src-tauri/target/release/bundle/msi/*.msi

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          pip install build
          cd mcp && python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: mcp/dist/*

  release:
    needs: [build-dashboard, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download dashboard
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: dashboard-windows
          path: artifacts/dashboard

      - name: Download python package
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: python-package
          path: artifacts/python

      - name: Create Private Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/dashboard/**/*.exe \
            artifacts/dashboard/**/*.msi \
            artifacts/python/*.whl \
            artifacts/python/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Public Release
        run: |
          gh release create ${{ github.ref_name }} \
            --repo cristian1991/AIDOCS \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/dashboard/**/*.exe \
            artifacts/dashboard/**/*.msi \
            artifacts/python/*.whl \
            artifacts/python/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
