[[IgnoredVulns]]
id = "GHSA-36p7-vc44-83pf"           # chromadb HTTP-API code injection (CWE-94)
# NO REVIEW DATE — see the entry above; the premise guard is the expiry.
reason = """
VEX: NOT AFFECTED (the vulnerable endpoint does not exist in this deployment).
Verbatim: "A code injection vulnerability in version 0.4.17 or later of the
ChromaDB Python project allows an authenticated attacker to run arbitrary code on
the server by sending a malicious model repository and trust_remote_code set to
true in the /api/v2/tenants/default_tenant/databases/default_database/collections/
{collection_id} if they have the UPDATE_COLLECTION permission." CWE-94.

EVERY precondition is a SERVER precondition: a network endpoint, an authenticated
principal, an UPDATE_COLLECTION permission, and a caller-supplied
trust_remote_code flag. AIDOCS runs chromadb EMBEDDED ONLY (PersistentClient /
EphemeralClient over local SQLite): there is no HTTP server, no /api/v2 route, no
permission model, and no path by which any caller supplies trust_remote_code.
chromadb is reached only through AIDOCS' own tool surface, never as a service.

This is materially the same defect as GHSA-f4j7-r4q5-qw2c above (same endpoint,
same trust_remote_code precondition, same CWE); it is waived separately because
osv-scanner matches on advisory id, not on defect.

THE ENDPOINT ARGUMENT IS NOT THE STRONGEST ONE, so it is not the one this entry
rests on. chromadb IS heavily used here — it is the memory surface for mempalace —
and a reviewer is right to ask whether the MODEL-LOADING code the injection lives
in is shared between server and embedded modes. It may well be. The waiver holds
anyway, because NOTHING A CALLER SUPPLIES EVER REACHES THE VULNERABLE ARGUMENT:

  * mempalace/backends/chroma.py builds the embedding function INTERNALLY
    (`from ..embedding import get_embedding_function` -> `get_embedding_function()`,
    chroma.py:1935-1937). Callers pass a palace path, a collection name and
    DOCUMENTS. They cannot pass an embedding function, a model name or a repo.
  * mempalace/embedding.py offers exactly TWO embedders, chosen by the
    MEMPALACE_EMBEDDING_MODEL env SELECTOR — not an arbitrary repo string:
      - a subclass of chromadb's own ONNXMiniLM_L6_V2 (local ONNX graph), and
      - EmbeddinggemmaONNX, whose repo is a MODULE CONSTANT
        (_EMBEDDINGGEMMA_REPO = "onnx-community/embeddinggemma-300m-ONNX") fetched
        with a hardcoded filename.
  * `trust_remote_code` appears ZERO times in mempalace/embedding.py, ZERO times
    in mempalace/backends/chroma.py, and ZERO times anywhere in server/,
    third_party/ or core/. The advisory requires it TRUE.

So the attacker-controlled inputs the advisory names — a malicious model
repository and trust_remote_code=true — are not merely unreachable over the
network; they are not reachable AT ALL, because the model is CONFIGURATION fixed
in source and memory content is DATA. A memory payload is a document, never a
model spec. That separation is what this waiver actually rests on, and it is the
thing to re-check: if a caller ever gains control of the embedding function, the
model name, or the repo, THIS WAIVER IS VOID regardless of transport.

VERIFIED BY SOURCE SCAN 2026-08-25 across server/, third_party/ and core/:
  0 hits for trust_remote_code, UPDATE_COLLECTION, chroma_server_auth,
    CHROMA_SERVER_AUTH, AuthorizationProvider or any auth/authz provider
  0 network-mode indicators (HttpClient, chroma_server_*, chroma_api_impl,
    uvicorn/FastAPI chroma bootstrap, tenant/database plumbing)
 22 files construct PersistentClient / EphemeralClient
A single hit for any of the above VOIDS this waiver; it must then be removed, not
re-dated.

No fixed release exists: affected 0.4.17-1.5.9, and 1.5.9 is still the latest on
PyPI (checked 2026-08-25). A version bump cannot clear it.
"""

