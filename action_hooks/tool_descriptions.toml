# AIDOCS Tool Descriptions — agent-facing, loaded at MCP startup.
# Terse, action-oriented. Lead with WHEN to use, not WHAT it does.

[tool_descriptions]

# ── Code reading ──
code_get_lines = "Read specific lines from a file. Use AFTER indexed tools narrow the target — not as a first step."
code_get_symbol_snippet = "Read a specific symbol's code by name. Faster than reading the whole file — just get the function/class you need."
code_bundle = "Get a structural overview of a file or subsystem in ONE call. Use to understand architecture before diving in."

# ── Code search ──
code_investigate = "START HERE for any new concept, feature, or bug area. Returns navigation guide + suggested next tools. Use when you don't know where to look."
code_find = "Unified find tool with 21 modes: symbols, references, routes, hotspots, duplicates, mutations, validation, and more. The Swiss Army knife."
code_search = "Find files by name or summary. Use modified_since to filter recent changes: 'today', '1h', '24h', '7d'. Replaces Glob."
code_text_search = "Literal text search across indexed files. Use | or OR between terms. Set regex=true for patterns. Glob filters files."
code_find_stale_references = "After renaming/deleting symbols, find remaining references that need updating. Pass the old symbol names."
code_find_dead_code = "Find dead imports and unused locals in a file. Use after refactors to clean up. Supports Python and JS/TS."
code_trace = "Trace relationships: field flow, service usage, model usage, component tree, CSS classes, API-to-UI paths."

# ── Code editing ──
code_str_replace = "Quick string-match edit (old_str must be under 500 chars, unique in file). No line numbers needed. For large blocks use code_edit_lines."
code_batch_str_replace = "Multiple string-match replacements across files, atomic. Max 20 edits. Use for scattered small changes."
code_edit_lines = "Replace a line range with new content. Pre-validates syntax for Python/JS/TS/JSON/TOML/XML. Use for block replacements."
code_insert_lines = "Insert content before a specific line. Simpler than code_edit_lines insert mode."
code_batch_edit = "Multiple line-range edits atomically across files. Bottom-up application preserves line numbers. Max 20 edits."
code_create_file = "Create a new file. Planning docs go in .MEMORY/roadmaps/ or .MEMORY/specs/, not project root."
code_extract_block = "Move a code block by line range from source to target file. Both files auto-reindexed."
code_extract_symbol = "Move a symbol (function/class) from source to target by name. No line numbers needed — uses the index."
code_find_symbol_range = "Find start and end line of a symbol. Use before extract_block if you need exact line numbers."
code_preview_extraction_deps = "Before extracting code, show what imports and helpers it depends on. Prevents broken extractions."
code_suggest_extractions = "Show the largest symbols in a file that are good extraction candidates. Use to plan deslopification."
code_refactor_extract = "Full refactor pipeline: find symbol → extract → reindex → detect stale references + dead code. One call does everything."

# ── Code precision ──
code_get_method_signature = "Get exact method signature (~30 tokens) without reading the file. Use BEFORE editing or calling a method — confirms params, return type."
code_get_method_signatures = "Get signatures for multiple methods in one call. Batch version — saves N file reads."
code_get_constructor_params = "Get constructor/record params without reading the file. Use BEFORE instantiating a class — confirms required args."
code_get_constructor_params_batch = "Get constructor params for multiple types in one call."
code_get_enum_values = "Get all enum members and values without reading the file. Use when you need valid states."
code_get_entity_properties = "Get all properties/fields of a data model or entity class without reading the file."
code_get_service_api = "Get the FULL API of any class in one call — all method names, signatures, containers. Replaces 5+ file reads."
code_get_dependencies = "Get import/dependency edges for a file. Use to understand what a file depends on."
code_get_modules = "List project modules (workspaces, subprojects)."
code_get_module_files = "List all indexed files in a module."

# ── Indexing ──
code_index_sync = "Rebuild code index. Run after external file changes. Edit tools auto-reindex the edited file."
code_index_status = "Check if code index is current."

# ── Schema ──
schema_query = "Query database schema: entities, fields, relationships, trace paths."
schema_index_sync = "Rebuild schema index from code and SQL files."

# ── Memory ──
memory_capture = "Save a durable fact/rule to project memory. Use target_hint for accurate routing (workflow, security, coding-standards, etc)."
memory_read = "Read memory files by path."
memory_search = "Search across all memory files by text."

# ── Sessions ──
session_list = "List all sessions."
session_read = "Read a session's router file."
session_select = "Select and return a session summary."
session_start = "Start/resume a session with index sync."
session_create = "Create a new session."
session_update = "Update session metadata."
session_journal_log = "Log a decision or outcome to the session journal."
session_journal_read = "Read journal entries."
session_resume_bundle = "Get full session context: project, session, skills, plan overview."

# ── Task lifecycle ──
task_begin = "Start work on a task. Pass session_id and goal — other fields are optional context."
task_update = "Record progress on current task. Pass session_id — other fields optional."
task_complete = "Close current task with result summary. Include verification evidence when available."

# ── Plan/conductor ──
planning_docs_list = "List all planning documents (roadmaps, plans, specs) with checkbox status summary."
planning_step_mark = "Toggle a checkbox in any planning doc. Status: done, open, skip, in_progress, blocked."
plan_connect = "Connect to existing plan — read state, find where work left off."
plan_create_from_spec = "Create session plan from a deterministic spec."
plan_conductor_status = "Get conductor lane graph and runnable lane status."
plan_dispatch_next = "Get next delegated lane task packet."
plan_dispatch_report = "Report delegated lane result back to conductor."

# ── Orchestration ──
orchestrate = "Full bootstrap/session/retrieval flow in one call."
handle_prompt = "Route a user prompt through AIDOCS classification and retrieval."
runtime_preflight = "Check runtime state before work."
project_bootstrap_or_resume = "Initialize or resume AIDOCS for a project."
