# ── Tool discovery ──
# Maps user intent keywords to recommended tools.
# When the user's prompt contains these keywords, the agent should prefer these tools.
# Format: [__tool_discovery_<name>]  tokens = [...]  tools = [tool1, tool2, ...]

[__tool_discovery_fix_and_debug]
tokens = ["fix", "repair", "bugged", "broken", "not working", "crash", "fails", "error", "debug", "diagnose", "wrong", "incorrect"]
tools = ["code_investigate", "code_trace", "code_find", "code_get_lines", "code_edit_lines", "code_str_replace", "code_test_project"]

[__tool_discovery_deslopify]
tokens = ["clean", "deslop", "deslopify", "refactor", "extract", "deduplicate", "dead code", "unused", "stale", "split", "decompose", "consolidate"]
tools = ["code_find_dead_code", "code_find_stale_references", "code_suggest_extractions", "code_refactor_extract", "code_find(mode=duplicates)", "code_find(mode=hotspots)"]

[__tool_discovery_understand]
