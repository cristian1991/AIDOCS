name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install MCP package
        run: |
          python -m pip install --upgrade pip
          pip install -e ./mcp

      - name: Initialize benchmark project
        run: |
          mkdir -p .benchmarks/sample_project/src
          cat > .benchmarks/sample_project/src/app.py <<'EOF'
          def hello():
              return "hello"
          EOF
          aidocs init ./.benchmarks/sample_project --json

      - name: Run public benchmark set
        run: |
          mkdir -p .benchmarks/results
          aidocs benchmark ./.benchmarks/sample_project --json --iterations 5 --scenario-set public --out ./.benchmarks/results/public-benchmark.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aidocs-public-benchmarks
          path: .benchmarks/results/public-benchmark.json
