<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIDOCS Workflow Inspection</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121933;
        --panel-2: #182246;
        --border: #2a3767;
        --text: #edf2ff;
        --muted: #9fb0df;
        --shared: #78d7ff;
        --claude: #ffb36b;
        --opencode: #9dffab;
        --accent: #7d8dff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 Inter, Segoe UI, Arial, sans-serif;
        background: linear-gradient(180deg, #0b1020 0%, #0d1430 100%);
        color: var(--text);
      }
      a { color: #b7c6ff; }
      code { font-family: Consolas, Monaco, monospace; font-size: 0.95em; }
      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero, .panel {
        background: rgba(18, 25, 51, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
      .hero {
        padding: 24px;
        margin-bottom: 20px;
      }
      .hero h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        max-width: 1000px;
      }
      .hero-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }
      .hero-links a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        text-decoration: none;
        background: rgba(255,255,255,0.03);
      }
      .controls {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
        padding: 18px;
        margin-bottom: 20px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .stat {
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        min-width: 140px;
      }
      .stat strong {
        display: block;
        font-size: 18px;
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .filter-row input {
        min-width: 280px;
        padding: 10px 12px;
        color: var(--text);
        background: #0b132c;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .chip-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        cursor: pointer;
        border: 1px solid var(--border);
        background: #101733;
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
      }
      .chip.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .sections {
        display: grid;
        gap: 20px;
      }
      .section {
        padding: 18px;
      }
      .section h2 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      .section-meta {
        color: var(--muted);
        margin-bottom: 14px;
      }
      .flows {
        display: grid;
        gap: 12px;
      }
      details.flow {
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        background: rgba(255,255,255,0.02);
      }
      details.flow[open] {
        background: rgba(255,255,255,0.04);
      }
      .flow summary {
        list-style: none;
        cursor: pointer;
        padding: 14px 16px;
      }
      .flow summary::-webkit-details-marker { display: none; }
      .flow-head {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 6px;
      }
      .lane {
        display: inline-flex;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .lane.shared { color: #06131a; background: var(--shared); }
      .lane.claude { color: #2d1700; background: var(--claude); }
      .lane.opencode { color: #09220d; background: var(--opencode); }
      .entrypoint {
        color: var(--muted);
        font-size: 13px;
      }
      .trigger {
        font-size: 16px;
        font-weight: 700;
      }
      .flow-body {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        padding: 0 16px 16px;
      }
      .kv {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0e1632;
      }
      .kv h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .kv p { margin: 0; }
      .kv ul {
        margin: 0;
        padding-left: 18px;
      }
      .kv li + li { margin-top: 4px; }
      .empty {
        color: var(--muted);
        font-style: italic;
      }
      .hidden { display: none !important; }
      @media (max-width: 800px) {
        .wrap { padding: 16px; }
        .hero h1 { font-size: 26px; }
        .filter-row { flex-direction: column; align-items: stretch; }
        .filter-row input { min-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1>AIDOCS Workflow Inspection</h1>
        <p>
          Actual current workflow, traced from install scripts, runtime entrypoints, host hooks, and plugin code.
          This page is meant to be read like a debugger map: trigger, function, decision, branch, write, result.
        </p>
        <div class="hero-links">
          <a href="flows.json">Flow source</a>
          <a href="sources.md">Evidence ledger</a>
          <a href="gaps.md">Observed gaps</a>
          <a href="../specs/2026-04-03-aidocs-workflow-inspection-design.md">Design spec</a>
        </div>
      </section>

      <section class="panel controls">
        <div class="stats" id="stats"></div>
        <div class="filter-row">
          <div class="chip-group" id="lane-filters">
            <button class="chip active" data-lane="all">All lanes</button>
            <button class="chip" data-lane="shared">Shared</button>
            <button class="chip" data-lane="claude">Claude</button>
            <button class="chip" data-lane="opencode">OpenCode</button>
          </div>
          <input id="search" type="search" placeholder="Filter by trigger, entrypoint, branch, file, or result" />
        </div>
      </section>

      <div class="sections" id="sections"></div>
    </div>

 "inputs": [], "reads": [], "decision": "string", "branches": [], "writes": [], "result": "string", "evidence": []}}</script>
    <script>
      const data = JSON.parse(document.getElementById("flow-data").textContent);
      const sectionsEl = document.getElementById("sections");
      const statsEl = document.getElementById("stats");
      const searchEl = document.getElementById("search");
      const laneButtons = Array.from(document.querySelectorAll("#lane-filters .chip"));

      let activeLane = "all";
      let searchTerm = "";

      function laneLabelClass(lane) {
        return `lane ${lane}`;
      }

      function cardList(items) {
        if (!items || !items.length) {
          return '<div class="empty">None</div>';
        }
        return `<ul>${items.map((item) => `<li>${escapeHtml(String(item))}</li>`).join("")}</ul>`;
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function flowMatches(flow) {
        if (activeLane !== "all" && flow.lane !== activeLane) {
          return false;
        }
        if (!searchTerm) {
          return true;
        }
        const haystack = [
          flow.id,
          flow.trigger,
          flow.layer,
          flow.entrypoint,
          flow.decision,
          flow.result,
          ...(flow.inputs || []),
          ...(flow.reads || []),
          ...(flow.branches || []),
          ...(flow.writes || []),
          ...(flow.evidence || []),
        ].join("\n").toLowerCase();
        return haystack.includes(searchTerm);
      }

      function renderStats(allFlows) {
        const counts = {
          total: allFlows.length,
          shared: allFlows.filter((flow) => flow.lane === "shared").length,
          claude: allFlows.filter((flow) => flow.lane === "claude").length,
          opencode: allFlows.filter((flow) => flow.lane === "opencode").length,
        };

        statsEl.innerHTML = `
          <div class="stat"><strong>${counts.total}</strong><span>Total traced flows</span></div>
          <div class="stat"><strong>${counts.shared}</strong><span>Shared flows</span></div>
          <div class="stat"><strong>${counts.claude}</strong><span>Claude flows</span></div>
          <div class="stat"><strong>${counts.opencode}</strong><span>OpenCode flows</span></div>
        `;
      }

      function render() {
        const allFlows = data.sections.flatMap((section) => section.flows || []);
        renderStats(allFlows);

        sectionsEl.innerHTML = data.sections.map((section) => {
          const flows = (section.flows || []).filter(flowMatches);
          return `
            <section class="panel section" id="${escapeHtml(section.id)}">
              <h2>${escapeHtml(section.title)}</h2>
              <div class="section-meta">${flows.length} matching flow${flows.length === 1 ? "" : "s"} in this section.</div>
              <div class="flows">
                ${flows.length ? flows.map((flow) => `
                  <details class="flow">
                    <summary>
                      <div class="flow-head">
                        <span class="${laneLabelClass(flow.lane)}">${escapeHtml(flow.lane)}</span>
                        <span class="entrypoint"><code>${escapeHtml(flow.entrypoint)}</code></span>
                      </div>
                      <div class="trigger">${escapeHtml(flow.trigger)}</div>
                    </summary>
                    <div class="flow-body">
                      <div class="kv"><h3>ID</h3><p><code>${escapeHtml(flow.id)}</code></p></div>
                      <div class="kv"><h3>Layer</h3><p>${escapeHtml(flow.layer)}</p></div>
                      <div class="kv"><h3>Decision</h3><p>${escapeHtml(flow.decision)}</p></div>
                      <div class="kv"><h3>Result</h3><p>${escapeHtml(flow.result)}</p></div>
                      <div class="kv"><h3>Inputs</h3>${cardList(flow.inputs)}</div>
                      <div class="kv"><h3>Reads</h3>${cardList(flow.reads)}</div>
                      <div class="kv"><h3>Branches</h3>${cardList(flow.branches)}</div>
                      <div class="kv"><h3>Writes</h3>${cardList(flow.writes)}</div>
                      <div class="kv"><h3>Evidence</h3>${cardList(flow.evidence)}</div>
                    </div>
                  </details>
                `).join("") : '<div class="empty">No flows match the current filter.</div>'}
              </div>
            </section>
          `;
        }).join("");
      }

      laneButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeLane = button.dataset.lane || "all";
          laneButtons.forEach((item) => item.classList.toggle("active", item === button));
          render();
        });
      });

      searchEl.addEventListener("input", () => {
        searchTerm = searchEl.value.trim().toLowerCase();
        render();
      });

      render();
    </script>
